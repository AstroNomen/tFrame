name: tFrame
options:
  bundleIdPrefix: com.vibe
  minimumSystemVersion: "14.0" # macOS Sonoma or later
targets:
  tFrame:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 TimeSlice"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.photography"
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        SWIFT_VERSION: 6.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Info.plist
      properties:
        CFBundleName: tFrame
        CFBundleDisplayName: tFrame
        CFBundleIdentifier: com.vibe.tFrame
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: 1
        NSPhotoLibraryUsageDescription: "tFrame needs access to your photo library to process images."
        NSPhotoLibraryAddUsageDescription: "tFrame needs access to save processed images to your library."
        NSSupportsAutomaticTermination: YES
        NSSupportsSuddenTermination: YES
